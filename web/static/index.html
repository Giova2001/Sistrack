<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order Track</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true">
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 3v6h8V3M7 21v-7h10v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-4.2 4.8M6.1 6.1C3.7 7.8 2 12 2 12s3.5 7 10 7a10.5 10.5 0 0 0 4.1-.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-panel-left" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4v16M5 8h2M5 12h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="app" id="appShell">
    <aside id="chatPanel" class="chat-panel" aria-label="Historial del chat">
      <div class="chat-head">
        <span class="chat-head-title">Historial</span>
        <div class="chat-head-actions">
          <button type="button" id="clearChatBtn" class="chat-icon-btn" title="Limpiar historial" aria-label="Limpiar historial">
            <svg class="icon"><use href="#i-trash"></use></svg>
          </button>
          <button type="button" id="collapseChatBtn" class="chat-icon-btn" title="Ocultar historial" aria-label="Ocultar historial">
            <svg class="icon"><use href="#i-chevron-left"></use></svg>
          </button>
        </div>
      </div>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-input">
        <input id="chatMessage" type="text" placeholder="Escribe tu mensaje" autocomplete="off" />
        <button type="submit" class="send-btn" title="Enviar" aria-label="Enviar">
          <svg class="icon"><use href="#i-send"></use></svg>
        </button>
      </form>
    </aside>

    <button type="button" id="chatRailBtn" class="chat-rail" title="Mostrar historial" aria-label="Mostrar historial" hidden>
      <svg class="icon"><use href="#i-chevron-right"></use></svg>
      <span class="chat-rail-label">Historial</span>
    </button>

    <main class="main">
      <header class="top">
        <h1>Order Track</h1>
        <div class="top-actions">
          <button id="themeBtn" class="icon-btn" title="Modo claro/oscuro" aria-label="Tema">
            <svg class="icon" id="themeIcon"><use href="#i-sun"></use></svg>
          </button>
          <button id="settingsBtn" class="icon-btn" title="Ajustes" aria-label="Ajustes">
            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>
        </div>
      </header>

      <div class="toolbar">
        <label class="pill date-pill" title="Cambiar fecha">
          <svg class="icon cal" aria-hidden="true"><use href="#i-calendar"></use></svg>
          <span id="fechaLabel">—</span>
          <input id="fechaInput" type="date" aria-label="Seleccionar fecha" />
        </label>
        <label class="pill view-pill">
          <select id="viewSelect">
            <option value="lista">Vista de documento</option>
            <option value="tabla">Vista de excel</option>
            <option value="simple">Vista simple</option>
          </select>
        </label>
      </div>

      <div class="workspace">
        <section id="recordsPanel" class="records-panel"></section>
        <aside class="actions">
          <button id="exportBtn" class="action green">
            <svg class="icon"><use href="#i-save"></use></svg>
            <span>Exportar a excel</span>
          </button>
          <button id="editBtn" class="action gray">
            <svg class="icon" id="editIcon"><use href="#i-pencil"></use></svg>
            <span id="editBtnLabel">Editar</span>
          </button>
          <button id="uploadBtn" class="action blue">
            <svg class="icon"><use href="#i-upload"></use></svg>
            <span>Subir datos al sistema</span>
          </button>
          <p id="uploadHint" class="hint"></p>
        </aside>
      </div>
    </main>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card modal-card-wide">
      <h2>Ajustes</h2>

      <section class="settings-section">
        <h3>Credenciales Sistrack</h3>
        <p class="muted">Se usan al subir pedidos al sistema.</p>
        <div class="creds-form">
          <label class="creds-field">
            <span>Email</span>
            <input id="sistrackEmail" type="email" autocomplete="username" placeholder="correo@ejemplo.com" />
          </label>
          <label class="creds-field">
            <span>Contraseña</span>
            <div class="creds-password-row">
              <input id="sistrackPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
              <button type="button" id="togglePassBtn" class="chat-icon-btn" title="Mostrar/ocultar contraseña" aria-label="Mostrar contraseña">
                <svg class="icon"><use href="#i-eye"></use></svg>
              </button>
            </div>
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h3>Campos del registro</h3>
        <p class="muted">Crea, edita, elimina o activa campos visibles y exportables.</p>

        <form id="fieldCreateForm" class="field-create">
          <input id="newFieldLabel" type="text" placeholder="Nombre del campo" required />
          <select id="newFieldType" title="Tipo">
            <option value="text">Texto</option>
            <option value="textarea">Texto largo</option>
            <option value="bool">Si/No</option>
            <option value="date">Fecha</option>
          </select>
          <button type="submit" class="action blue mini">
            <svg class="icon"><use href="#i-plus"></use></svg>
            <span>Agregar</span>
          </button>
        </form>

        <div id="fieldsList" class="fields-list"></div>
      </section>

      <div class="modal-actions">
        <button id="settingsReset" type="button" class="action gray">Restablecer campos</button>
        <button id="settingsCancel" type="button" class="action gray">Cancelar</button>
        <button id="settingsSave" type="button" class="action blue">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
