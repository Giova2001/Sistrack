<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cobros — Order Track</title>
  <style>
    .svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; display: none !important; }
    svg.icon { width: 1.15rem; height: 1.15rem; display: inline-block; flex-shrink: 0; overflow: visible; }
    .hidden { display: none !important; }
  </style>
  <link rel="stylesheet" href="styles.css?v=cob1" />
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="svg-sprite" aria-hidden="true" focusable="false" width="0" height="0">
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.2M21 3v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 10v4M18 10v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <div class="app inv-app">
    <main class="main">
      <header class="top">
        <h1>Cobros</h1>
        <div class="top-actions">
          <a class="icon-btn" href="/" title="Volver a pedidos" aria-label="Pedidos">OT</a>
          <a class="icon-btn" href="inventario.html" title="Inventario" aria-label="Inventario">Inv</a>
          <button id="themeBtn" class="icon-btn" title="Modo claro/oscuro" aria-label="Tema">
            <svg class="icon" id="themeIcon"><use href="#i-sun"></use></svg>
          </button>
          <button id="refreshBtn" class="icon-btn" title="Actualizar" aria-label="Actualizar">
            <svg class="icon"><use href="#i-refresh"></use></svg>
          </button>
        </div>
      </header>

      <div id="cobSummary" class="inv-summary"></div>

      <div class="toolbar">
        <div class="inv-tabs" role="tablist">
          <button class="pill inv-tab active" data-tab="lista">Lista</button>
          <button class="pill inv-tab" data-tab="registrar">Registrar cobro</button>
          <button class="pill inv-tab" data-tab="saldos">Saldos pendientes</button>
          <button class="pill inv-tab" data-tab="historial">Historial</button>
        </div>
      </div>

      <div id="cobFlash" class="inv-flash hidden"></div>

      <section id="tab-lista" class="inv-panel">
        <div class="toolbar">
          <label class="pill"><input id="filtroBuscar" type="search" placeholder="Buscar cliente, pedido o cobro" /></label>
          <label class="pill">
            <select id="filtroEstado">
              <option value="">Todos los estados</option>
              <option value="Pendiente">Pendiente</option>
              <option value="Pago Parcial">Pago Parcial</option>
              <option value="Pagado">Pagado</option>
            </select>
          </label>
          <label class="pill">
            <input id="filtroFecha" type="date" />
          </label>
        </div>
        <div class="inv-table-wrap">
          <table class="inv-table">
            <thead>
              <tr>
                <th>Cobro</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Método</th>
                <th>Monto</th>
                <th>Estado del pedido</th>
              </tr>
            </thead>
            <tbody id="listaBody"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-registrar" class="inv-panel hidden">
        <form id="formCobro" class="inv-form">
          <h2>Registrar cobro</h2>
          <label>Pedido con saldo
            <select id="cobroPedido" required></select>
          </label>
          <p id="cobroHint" class="muted">Selecciona un pedido para ver el saldo pendiente.</p>
          <label>Monto
            <input id="cobroMonto" type="number" min="0.01" step="0.01" required />
          </label>
          <label>Método de pago
            <select id="cobroMetodo" required></select>
          </label>
          <label>Fecha de cobro
            <input id="cobroFecha" type="date" required />
          </label>
          <label>Referencia / observaciones
            <textarea id="cobroObs" rows="3" placeholder="Transferencia, voucher, nota…"></textarea>
          </label>
          <div class="inv-form-actions">
            <button type="submit" class="action blue">Guardar cobro</button>
          </div>
        </form>
      </section>

      <section id="tab-saldos" class="inv-panel hidden">
        <div class="inv-table-wrap">
          <table class="inv-table">
            <thead>
              <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Pagado</th>
                <th>Saldo</th>
                <th>Estado</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="saldosBody"></tbody>
          </table>
        </div>
      </section>

      <section id="tab-historial" class="inv-panel hidden">
        <div class="inv-table-wrap">
          <table class="inv-table">
            <thead>
              <tr>
                <th>Cobro</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Método</th>
                <th>Monto</th>
                <th>Nota</th>
              </tr>
            </thead>
            <tbody id="historialBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="cobros.js?v=cob1"></script>
</body>
</html>
